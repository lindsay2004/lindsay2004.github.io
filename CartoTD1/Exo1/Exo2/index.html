<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD1 - Exo 2 : Leaflet & Géolocalisation</title>
    
    <!-- Feuille de style CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { font-family: sans-serif; margin: 0; padding: 15px; }
        #info-panel { background: #f0f4f8; padding: 10px 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #0066cc; }
        /* Indispensable : sans hauteur définie, la carte reste invisible */
        #map { height: 75vh; width: 100%; border-radius: 8px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <a href="../../index.html">← Retour au menu</a>
    <h1>Exercice 2 : Carte Leaflet</h1>

    <div id="info-panel">
        <strong>Distance jusqu'à Marseille :</strong> <span id="distance-marseille">Calcul en cours...</span>
    </div>

    <div id="map"></div>

    <!-- Bibliothèque JavaScript Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Coordonnées de référence
        const coordsNice = [43.7009, 7.2683];
        const coordsMarseille = [43.2965, 5.3698];

        // 1. Définition des fonds de carte (OpenStreetMap + Stadia/Stamen avec le token du TD)
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        const stadiaToken = 'eed6a6b4-d171-43e4-8215-e5f8490b4245';
        const stadiaWatercolor = L.tileLayer(`https://tiles.stadiamaps.com/tiles/stamen_watercolor/{z}/{x}/{y}.jpg?api_key=${stadiaToken}`, {
            maxZoom: 16,
            attribution: '© Stadia Maps, © Stamen Design, © OpenStreetMap'
        });

        // Création de la carte (centrée sur Nice par défaut avant le signal GPS)
        const map = L.map('map', {
            center: coordsNice,
            zoom: 12,
            layers: [osmLayer]
        });

        // Bouton en haut à droite pour changer de style de carte
        L.control.layers({
            "OpenStreetMap": osmLayer,
            "Stamen Watercolor": stadiaWatercolor
        }).addTo(map);

        // 2. Marqueur sur Nice centre-ville
        L.marker(coordsNice).addTo(map)
            .bindPopup("<b>Nice Centre-Ville</b>");

        // 3. Triangle des Bermudes en rouge (Miami, Bermudes, Porto Rico)
        const triangleBermudes = [
            [25.7617, -80.1918],
            [32.3078, -64.7505],
            [18.4655, -66.1057]
        ];
        L.polygon(triangleBermudes, {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.3
        }).addTo(map).bindPopup("<b>Triangle des Bermudes</b>");

        // 4. Récupération de ta position GPS + Cercle de précision
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const precision = pos.coords.accuracy;
                    const maPosition = [lat, lon];

                    // Centrer la carte sur ta position
                    map.setView(maPosition, 13);

                    // Marqueur sur ta position
                    L.marker(maPosition).addTo(map)
                        .bindPopup(`<b>Ma position</b><br>Précision : ±${Math.round(precision)} m`)
                        .openPopup();

                    // Cercle représentant la précision estimée (rayon en mètres)
                    L.circle(maPosition, {
                        radius: precision,
                        color: '#28a745',
                        fillColor: '#28a745',
                        fillOpacity: 0.2
                    }).addTo(map);
                },
                (err) => {
                    alert("Erreur GPS : " + err.message);
                },
                { enableHighAccuracy: true, timeout: 30000, maximumAge: 10000 }
            );
        }
    </script>
</body>
</html>
