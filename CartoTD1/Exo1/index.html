<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD1 - Exo 1 : Géolocalisation</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; line-height: 1.5; }
        .box { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 20px; background: #f9f9f9; }
        h2 { margin-top: 0; font-size: 1.2rem; color: #0066cc; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <a href="../../index.html">← Retour au menu</a>
    <h1>Exercice 1 : Géolocalisation</h1>

    <div class="box">
        <h2>1. getCurrentPosition() (Position unique)</h2>
        <div id="current-result">En attente de localisation...</div>
    </div>

    <div class="box">
        <h2>2. watchPosition() (Suivi en continu)</h2>
        <div id="watch-result">En attente de déplacement...</div>
    </div>

    <script>
        // Fonction utilitaire pour formater proprement les données d'un objet GeolocationPosition
        function formaterPosition(position) {
            const c = position.coords;
            // Conversion du timestamp (en millisecondes) en date lisible
            const dateStr = new Date(position.timestamp).toLocaleString('fr-FR');

            return `
                <ul>
                    <li><strong>Latitude :</strong> ${c.latitude}</li>
                    <li><strong>Longitude :</strong> ${c.longitude}</li>
                    <li><strong>Altitude :</strong> ${c.altitude !== null ? c.altitude + ' m' : 'Non disponible'}</li>
                    <li><strong>Précision :</strong> ${c.accuracy} mètres</li>
                    <li><strong>Vitesse :</strong> ${c.speed !== null ? c.speed + ' m/s' : 'Non disponible (immobile)'}</li>
                    <li><strong>Date (timestamp) :</strong> ${dateStr}</li>
                </ul>
            `;
        }

        // Fonction de gestion des erreurs (ex: refus de permission ou GPS désactivé)
        function gererErreur(err) {
            return `<p class="error">Erreur (${err.code}) : ${err.message}</p>`;
        }

        // Options pour forcer la meilleure précision possible (utilise la puce GPS sur mobile)
        const options = {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        };

        // Vérification que le navigateur supporte la géolocalisation
        if ("geolocation" in navigator) {
            
            // 1. Appel ponctuel : getCurrentPosition
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    document.getElementById('current-result').innerHTML = formaterPosition(pos);
                },
                (err) => {
                    document.getElementById('current-result').innerHTML = gererErreur(err);
                },
                options
            );

            // 2. Appel continu : watchPosition
            navigator.geolocation.watchPosition(
                (pos) => {
                    document.getElementById('watch-result').innerHTML = formaterPosition(pos);
                },
                (err) => {
                    document.getElementById('watch-result').innerHTML = gererErreur(err);
                },
                options
            );

        } else {
            document.body.innerHTML += "<p class='error'>La géolocalisation n'est pas supportée par ce navigateur.</p>";
        }
    </script>
</body>
</html>
